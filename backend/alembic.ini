# ==============================================================================
# Alembic Configuration - Sistema POS 90 Grados
# Restaurante-Bar 90 Grados · Cundinamarca, Colombia
# SEGURIDAD: Cero contraseñas o URLs de base de datos en texto plano en este archivo.
# La URL de conexión se inyecta dinámicamente desde la variable de entorno DATABASE_URL.
# ==============================================================================

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
timezone = America/Bogota

# sqlalchemy.url NO se define aquí de forma estática para prevenir filtración de credenciales.
# migrations/env.py lee estrictamente la variable de entorno DATABASE_URL.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
